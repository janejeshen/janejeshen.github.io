```yaml
# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Site language
lang: en

# Timezone
timezone: Africa/Nairobi

# Site title
title: "Jane Njuguna"

# Professional tagline
tagline: "Data Analyst | Data Engineer | Data Scientist"

# SEO description
description: >-
  Jane Njuguna is a data professional focused on data analysis, data engineering,
  and data science, using data to turn information into meaningful insights and solutions.

# Website URL
url: "https://janejeshen.github.io"

# GitHub
github:
  username: janejeshen

# Twitter/X
# twitter:
#   username:

# Social information
social:
  name: Jane Njeri Njuguna
  email: janenjuguna550@gmail.com
  links:
    - https://github.com/janejeshen
    - https://www.linkedin.com/in/jane-njuguna

# Site verification
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views
pageviews:
  provider:

# Theme mode
# Leave empty so visitors can switch between light and dark mode.
theme_mode:

# CDN
cdn:

# Profile photo
# Make sure your image is actually located at this path.
avatar: /assets/profile.jpeg

# Social preview image
# We can add this later for LinkedIn/social sharing.
social_preview_image:

# Table of contents
toc: true

# Actions
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments
# Not needed for a professional portfolio.
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1

# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:

# Progressive Web App
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# Base URL
baseurl: ""

# ------------ Do not modify below this line unless necessary ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Tabs / portfolio sections
collections:
  tabs:
    output: true
    sort_by: order

# Default settings
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Sass
sass:
  style: compressed

# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Files to exclude from the generated site
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# Jekyll archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
```
